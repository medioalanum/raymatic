<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Alan Viana">
  <title>{{ title }} · medioalanum</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #202020; background: #f7f5f0; }
    body { margin: 0; line-height: 1.7; }
    .shell { max-width: 760px; margin: 0 auto; padding: 1.25rem; }
    .site-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #d8d2c5; }
    .wordmark { color: #202020; font: 700 1.4rem system-ui, sans-serif; text-decoration: none; }
    nav a { margin-left: 1rem; color: #555; font: .9rem system-ui, sans-serif; }
    main { padding-top: 2.5rem; }
    h1, h2 { line-height: 1.2; }
    h1 { font-size: 2.2rem; }
    h2 { margin-top: 2.5rem; }
    a { color: #9a5c00; }
    .post-meta { color: #716b60; font: .9rem system-ui, sans-serif; }
    code, pre { background: #ece8df; }
    code { padding: .1rem .25rem; }
    pre { padding: 1rem; overflow-x: auto; }
    footer { margin-top: 5rem; border-top: 1px solid #d8d2c5; color: #716b60; font: .9rem system-ui, sans-serif; }
  </style>
</head>
<body><main class="shell">{{ body }}</main><footer class="shell">medioalanum · Notes, ideas, practice, progress.</footer></body>
</html>
