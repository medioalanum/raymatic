<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Raymatic — static publishing without managing an SSG.">
  <title>{{ title }} · Raymatic</title>
  <style>
    :root { color-scheme: dark; --bg:#111110; --surface:#171715; --surface-2:#1d1d1a; --fg:#e9e7df; --muted:#94938b; --border:#30302c; --link:#d2a550; --danger:#e58d72; }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace} a{color:var(--link);text-decoration:none}a:hover,a:focus-visible{color:var(--fg);text-decoration:underline}a:focus-visible{outline:2px solid var(--link);outline-offset:3px}.shell{width:min(100% - 32px,960px);margin:auto}header{border-bottom:1px solid var(--border)}.nav{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--fg);font-weight:650;letter-spacing:.05em}.nav-links{display:flex;gap:22px;align-items:center;font-size:13px}.theme-toggle{position:absolute;opacity:0}.theme-label{cursor:pointer;color:var(--muted)}body:has(.theme-toggle:checked){--bg:#f7f5ef;--surface:#fffdf8;--surface-2:#efede5;--fg:#262621;--muted:#68675f;--border:#d8d5cd;--link:#885f18;--danger:#a34e36;color-scheme:light}.content{padding-bottom:90px}.hero{padding:64px 0 0}.eyebrow,.kicker{color:var(--link);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,64px);letter-spacing:-.07em;line-height:1.05;max-width:720px;margin:12px 0}.hero .sub{font-size:clamp(18px,3vw,24px);color:var(--muted);margin:0;letter-spacing:-.04em}.hero .desc{max-width:430px;color:var(--muted);margin:22px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.button{padding:8px 13px;border:1px solid var(--border);border-radius:4px;font-size:13px}.button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}section{margin-top:88px}h2{font-size:28px;letter-spacing:-.06em;line-height:1.15;margin:10px 0 16px;max-width:760px}h3{font-size:17px;letter-spacing:-.03em;margin:0 0 8px}.muted{color:var(--muted);max-width:620px}.terminal,.code,.diagnostic,.flow{border:1px solid var(--border);background:var(--surface);border-radius:5px;overflow:hidden}.bar{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}.terminal pre,.code pre,.diagnostic pre,.flow pre{margin:0;padding:18px;overflow:auto;font:13px/1.75 inherit;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}.kicker{margin:0 0 8px}.command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.command{padding:18px 14px;border-right:1px solid var(--border)}.command:last-child{border-right:0}.command code{display:block;color:var(--fg);margin-bottom:7px}.command p,.principle p{color:var(--muted);font-size:13px;margin:0}.principles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.principle .num{color:var(--link);font-size:12px}.diagnostic{border-color:#684035;background:color-mix(in srgb,var(--danger) 8%,var(--surface))}.diagnostic strong{display:block;padding:16px 18px;color:var(--danger);font-size:13px}.doc{max-width:760px;padding:65px 0}.doc h1{font-size:clamp(38px,6vw,58px);letter-spacing:-.07em;line-height:1.05;margin:10px 0 20px}.doc h2{margin-top:55px}.doc p{color:var(--muted)}.doc pre{border:1px solid var(--border);background:var(--surface);padding:18px;overflow:auto}footer{border-top:1px solid var(--border);padding:26px 0 42px;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between}
    @media(max-width:720px){.nav-links{gap:10px;font-size:11px}.hero{padding-top:48px}.grid,.principles{grid-template-columns:1fr}.command-grid{grid-template-columns:repeat(2,1fr)}.command:nth-child(2){border-right:0}.command:nth-child(-n+2){border-bottom:1px solid var(--border)}.command:nth-child(3){border-right:1px solid var(--border)}.foot{display:block}.foot p{margin-top:8px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body><header><div class="shell nav"><a class="brand" href="/index.html">/raymatic</a><nav class="nav-links" aria-label="Primary"><a href="/docs/index.html">Docs</a><a href="/philosophy/index.html">Philosophy</a><a href="https://github.com/medioalanum/raymatic">GitHub ↗</a><input class="theme-toggle" id="theme-toggle" type="checkbox"><label class="theme-label" for="theme-toggle">Theme</label></nav></div></header><main class="shell content">{{ body }}</main><footer><div class="shell foot"><strong>/raymatic</strong><p>Static publishing without managing an SSG.</p></div></footer></body>
</html>
