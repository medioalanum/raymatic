<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Raymatic — static publishing without managing an SSG.">
  <title>{{ title }} · Raymatic</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d0c; --panel:#151513; --panel-2:#1c1c19; --ink:#f1eee7; --muted:#9d9b91; --line:#30302b; --accent:#e3a83a; --accent-2:#f2c66d; --code:#11110f; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    a { color:var(--accent-2); text-decoration:none; }
    a:hover, a:focus-visible { color:#fff; text-decoration:underline; }
    a:focus-visible, button:focus-visible { outline:2px solid var(--accent-2); outline-offset:4px; }
    .shell { width:min(100% - 40px, 1080px); margin:0 auto; }
    header { border-bottom:1px solid var(--line); }
    .nav { display:flex; align-items:center; justify-content:space-between; min-height:76px; gap:24px; }
    .brand { color:var(--ink); font-size:1.05rem; font-weight:700; letter-spacing:.08em; }
    .nav-links { display:flex; align-items:center; gap:25px; font-size:.8rem; }
    .theme-toggle { position:absolute; opacity:0; pointer-events:none; }
    .theme-label { cursor:pointer; color:var(--muted); }
    body:has(.theme-toggle:checked) { --bg:#f2efe8; --panel:#fffdf8; --panel-2:#f5f1e8; --ink:#171714; --muted:#64645d; --line:#d5d0c5; --accent:#a66c16; --accent-2:#80500b; --code:#ebe7dd; }
    main { overflow:hidden; }
    .hero { padding:110px 0 95px; text-align:center; }
    .eyebrow { color:var(--accent); font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; }
    h1,h2,h3 { margin:0; line-height:1.12; letter-spacing:-.06em; }
    h1 { max-width:850px; margin:20px auto; font-size:clamp(2.5rem,7vw,5.8rem); }
    h2 { font-size:clamp(2rem,4vw,3.6rem); }
    h3 { font-size:1.1rem; letter-spacing:-.02em; }
    .lede { max-width:620px; margin:0 auto 34px; color:var(--muted); font-size:1rem; }
    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; }
    .button { display:inline-block; padding:11px 17px; border:1px solid var(--line); border-radius:5px; font-size:.78rem; }
    .button.primary { border-color:var(--accent); background:var(--accent); color:#17130b; }
    .button:hover { text-decoration:none; border-color:var(--accent-2); }
    .terminal { margin:0 auto; max-width:780px; border:1px solid var(--line); border-radius:7px; background:var(--code); text-align:left; box-shadow:0 20px 80px #0008; }
    .terminal-bar { display:flex; gap:7px; padding:12px 15px; border-bottom:1px solid var(--line); }
    .dot { width:9px; height:9px; border-radius:50%; background:#474741; }
    pre { margin:0; padding:22px; overflow:auto; color:#dedbd2; font:inherit; font-size:.85rem; white-space:pre-wrap; }
    code { color:var(--accent-2); }
    section { padding:92px 0; border-top:1px solid var(--line); }
    .section-copy { max-width:650px; margin:18px 0 34px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { padding:25px; border:1px solid var(--line); border-radius:6px; background:var(--panel); }
    .card p, .doc p { color:var(--muted); }
    .number { color:var(--accent); font-size:.75rem; }
    .tree { color:#c8c4b8; }
    .tree span { color:var(--accent-2); }
    .diagnostic { border-left:3px solid #cf735d; background:#1a1513; }
    .diagnostic strong { color:#f19b7f; }
    .commands { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .command { padding:19px; border:1px solid var(--line); background:var(--panel); }
    .command code { display:block; margin-bottom:10px; color:var(--ink); }
    .command p { margin:0; color:var(--muted); font-size:.82rem; }
    .doc { max-width:760px; padding:80px 0 110px; }
    .doc h1 { margin:0 0 20px; text-align:left; font-size:clamp(2.2rem,6vw,4.4rem); }
    .doc h2 { margin:58px 0 18px; font-size:2rem; }
    .doc h3 { margin:30px 0 10px; }
    .doc pre { margin:20px 0; border:1px solid var(--line); border-radius:5px; }
    footer { padding:32px 0 55px; border-top:1px solid var(--line); color:var(--muted); font-size:.78rem; }
    .footer-row { display:flex; justify-content:space-between; gap:20px; }
    @media (max-width:720px) { .shell { width:min(100% - 28px, 620px); } .nav { min-height:64px; } .nav-links { gap:12px; font-size:.7rem; } .hero { padding:76px 0 64px; } section { padding:65px 0; } .grid, .commands { grid-template-columns:1fr; } .footer-row { display:block; } .footer-row p { margin-top:12px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header><div class="shell nav"><a class="brand" href="index.html">/raymatic</a><nav class="nav-links" aria-label="Primary"><a href="docs/index.html">Docs</a><a href="philosophy/index.html">Philosophy</a><a href="https://github.com/medioalanum/raymatic">GitHub ↗</a><input class="theme-toggle" id="theme-toggle" type="checkbox"><label class="theme-label" for="theme-toggle">Switch to light theme</label></nav></div></header>
  <main class="shell">{{ body }}</main>
  <footer><div class="shell footer-row"><strong>/raymatic</strong><p>Static publishing without managing an SSG.</p></div></footer>
</body>
</html>
